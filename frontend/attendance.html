<html lang="en">
<head>
<meta charset="UTF-8">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
/* ========================= GLOBAL THEME ========================= */
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:'Inter',sans-serif;
  background:#0a0a0a;
  color:#ffffff;
  overflow-x:hidden;
  padding-top:90px;
}


/* ========================= PAGE LAYOUT ========================= */
.main-container{
  display:flex;
  width:100%;
  max-width:1400px;
  margin:0 auto;
  padding:2rem;
  gap:2rem;
}

/* ========================= CAMERA SECTION ========================= */
.camera-section{
  flex:1;background:#0f0f0f;
  border-radius:16px;
  border:1px solid #1a1a1a;
  padding:1.5rem;
  box-shadow:0 0 40px rgba(0,255,136,0.07);
}
.camera-section h2{
  font-size:1.8rem;color:#00ff88;margin-bottom:1rem;
}
video{
  width:100%;height:450px;
  border-radius:14px;
  border:2px solid #00ff88;
  box-shadow:0 0 25px rgba(0,255,136,0.3);
  object-fit:cover;
}

.btn-row{display:flex;gap:15px;margin-top:15px;}

button{
  padding:12px 30px;border:none;
  border-radius:10px;font-size:1rem;
  font-weight:700;cursor:pointer;
}

#startBtn{background:#00ff88;color:#000;}
#stopBtn{background:#ff4d4d;color:#fff;}

#visualBtn{
  margin-top:15px;
  background:#00d4ff;color:#000;
  box-shadow:0 0 15px rgba(0,212,255,0.4);
}

#statusBox{
  margin-top:20px;padding:1rem;background:#111;
  border-left:6px solid #00ff88;border-radius:8px;
}
#resultBox{
  margin-top:15px;padding:0.8rem;font-size:1.2rem;
  border-radius:10px;font-weight:700;display:none;
}

/* ========================= LOGS SECTION ========================= */
.logs-section{
  flex:1;background:#0f0f0f;
  border-radius:16px;border:1px solid #1a1a1a;
  padding:1.5rem;
}
.logs-section h2{color:#00ff88;text-align:center;}
table{width:100%;border-collapse:collapse;}
th{
  background:#111;padding:12px;color:#00ff88;
}
td{
  padding:12px;text-align:center;color:#ccc;background:#0c0c0c;
}

/* Header */
    .header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background: rgba(10, 10, 10, 0.95);
      backdrop-filter: blur(20px);
      padding: 1.2rem 3rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 1000;
      border-bottom: 1px solid var(--border);
    }

    body.light-mode .header {
      background: rgba(255, 255, 255, 0.95);
    }

    .logo {
      font-size: 2rem;
      font-weight: 800;
      color: var(--primary);
      text-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
      text-decoration: none;
      letter-spacing: 1px;
      cursor: pointer;
    }

    .nav-menu {
      display: flex;
      gap: 2.5rem;
      list-style: none;
    }

    .nav-menu a {
      color: #b0b0b0;
      text-decoration: none;
      font-weight: 500;
      transition: all 0.3s ease;
      padding: 0.6rem 1.2rem;
      border-radius: 8px;
      font-size: 0.95rem;
    }

    .nav-menu a:hover {
      color: var(--primary);
      background: rgba(0, 255, 136, 0.1);
    }

    body.light-mode .nav-menu a {
      color: #4a4a4a;
    }

    body.light-mode .nav-menu a:hover {
      color: #00cc6f;
      background: rgba(0, 204, 111, 0.1);
    }

    .header-actions {
      display: flex;
      gap: 1rem;
      align-items: center;
    }

    .btn-back {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--primary);
      padding: 0.6rem 1.5rem;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
    }

    .btn-back:hover {
      box-shadow: 0 0 20px rgba(0, 255, 136, 0.2);
    }

    .theme-toggle {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--primary);
      font-size: 1.3rem;
      width: 45px;
      height: 45px;
      border-radius: 50%;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .theme-toggle:hover {
      transform: scale(1.1);
      box-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
    }

/* ========================= VISUAL PANEL ========================= */
#visualPanel{
  position:fixed;top:0;left:0;width:100%;height:100%;
  background:rgba(0,0,0,0.85);backdrop-filter:blur(6px);
  display:none;z-index:3000;
  display:flex;
}

/* LEFT NAVBAR */
.visual-nav{
  width:0;
  overflow:hidden;
  transition:0.4s ease;
  background:#0f0f0f;
  border-right:1px solid #1a1a1a;
  padding:0;
}

.visual-nav button{
  background:#111;border:1px solid #222;color:#00ff88;
  padding:12px;border-radius:10px;text-align:left;
  font-size:1rem;font-weight:600;cursor:pointer;
  transition:0.3s;
}
.visual-nav button:hover{
  background:#00ff88;color:#000;
}

/* MAIN CHART AREA */
.visual-content{
  flex:1;padding:2rem;overflow-y:auto;position:relative;
}

#closeVisual{
  display:none;
  position:absolute;
  top:20px;
  right:20px;
  background:#ff4d4d;
  padding:10px 20px;
  border-radius:10px;
}


.chart-box{
  display:none;
  background:#111;padding:2rem;
  border-radius:16px;box-shadow:0 0 20px rgba(0,255,136,0.2);
}
.chart-box.active{display:block;}
.low-card{
  background:#1a0000;
  border-left:6px solid #ff4d4d;
  padding:15px;
  border-radius:12px;
  margin-top:12px;
  box-shadow:0 0 12px rgba(255,77,77,0.3);
}

.low-card b{
  color:#ff8080;
  font-size:1.1rem;
}

</style>
</head>

<body>

<!-- ========================= HEADER ========================= -->
<header class="header">
  <a href="#" class="logo">CoreSight</a>

<nav>
  <ul class="nav-menu">

    <li>
      <a href="/frontend/index.html">
        Home

    </li>

    <li>
      <a href="/frontend/Student%20Registration.html">

      </a>
    </li>

    <li>
      <a href="/frontend/face_recognition.html">

      </a>
    </li>

    <li>
      <a href="/frontend/document.html">

      </a>
    </li>

    </li>

    <li>

    </li>

    <li>
      <a href="/frontend/index.html#about">

      </a>
    </li>

  </ul>
</nav>
  <button class="btn-back" id="backBtn">← Back</button>
</header>

<!-- ========================= MAIN ========================= -->
<div class="main-container">

  <!-- LEFT CAM -->
  <div class="camera-section">
    <h2>Live Camera</h2>
    <video id="video" autoplay muted></video>
    <canvas id="canvas" style="display:none;"></canvas>

    <div class="btn-row">
      <button id="startBtn">Start Attendance</button>
      <button id="stopBtn">Stop</button>
    </div>

    <button id="visualBtn">View Analysis</button>

    <div id="statusBox">Initializing camera...</div>
    <div id="resultBox"></div>
  </div>

  <!-- RIGHT LOGS -->
  <div class="logs-section">
    <h2>Today's Attendance Logs</h2>
    <table id="logTable">
      <thead><tr>
        <th>Roll No</th><th>Date</th><th>Time</th><th>Status</th>
      </tr></thead>
      <tbody></tbody>
    </table>
  </div>

</div>


<!-- ========================= SCRIPT ========================= -->
<script src="/config.js"></script>
<script>
const API_BASE = window.CONFIG.API_BASE_URL;

// 🔊 Track roll numbers already spoken
const spokenRolls = new Set();



// BACK BUTTON
document.getElementById("backBtn").onclick = ()=> window.history.back();

// ---------------- CAMERA SETUP ----------------
const video=document.getElementById("video");
const canvas=document.getElementById("canvas");
async function startCamera(){
  try{
    const stream=await navigator.mediaDevices.getUserMedia({video:true});
    video.srcObject=stream;
  }catch{alert("Camera error");}
}
startCamera();

// ---------------- LOAD ATTENDANCE LOGS ----------------
async function loadLogs(){
  const res=await fetch(`${API_BASE}/attendance/logs-today`);
  const data=await res.json();
  const tbody=document.querySelector("#logTable tbody");
  tbody.innerHTML="";

  data.logs.forEach(log=>{
    tbody.innerHTML+=`
      <tr>
        <td>${log.roll_no}</td>
        <td>${log.date}</td>
        <td>${log.time}</td>
        <td style="color:#00ff88;">${log.status}</td>
      </tr>`;
  });
}

loadLogs();



/* ------------------------ REAL-TIME ATTENDANCE ENGINE ------------------------ */

let intervalId = null;
let isRunning = false;

// Button references
const startBtn = document.getElementById("startBtn");
const stopBtn = document.getElementById("stopBtn");
const statusBox = document.getElementById("statusBox");
const resultBox = document.getElementById("resultBox");

// ---------- START BUTTON ----------
startBtn.onclick = async function () {
    if (isRunning) return;
    isRunning = true;

    statusBox.innerHTML = "Recognition started...";
    resultBox.style.display = "none";

    intervalId = setInterval(captureFrame, 800); // send frame every 800ms
};

// ---------- STOP BUTTON ----------
stopBtn.onclick = function () {
    isRunning = false;
    clearInterval(intervalId);
    statusBox.innerHTML = "Recognition stopped.";
};

// ---------- CAPTURE FRAME AND SEND TO BACKEND ----------
async function captureFrame() {
    if (!isRunning) return;

    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

    const blob = await new Promise(resolve => canvas.toBlob(resolve, "image/jpeg"));

    const formData = new FormData();
    formData.append("frame", blob);

    const response = await fetch(`${API_BASE}/attendance/mark-by-face`, {
        method: "POST",
        body: formData
    });

    const data = await response.json();
    handleResponse(data);
}

/* ------------------------ RESPONSE HANDLER ------------------------ */

function handleResponse(data) {

    if (data.status === "no_face") {
        statusBox.innerHTML = "No face detected.";
        return;
    }

    if (data.status === "unknown") {
        statusBox.innerHTML = "Unknown face detected.";
        return;
    }

    if (data.status === "already_marked") {
        resultBox.style.display = "block";
        resultBox.style.background = "#ffcc00";
        resultBox.style.color = "#000";
        resultBox.innerHTML = `Already Marked: ${data.roll_no}`;

        // ❌ DO NOT speak again
        return;
    }

    if (data.status === "marked_present") {
        resultBox.style.display = "block";
        resultBox.style.background = "#00ff88";
        resultBox.style.color = "#000";
        resultBox.innerHTML = `Attendance Marked: ${data.roll_no}`;

        // ✅ Update logs only for new student
        loadLogs();
        return;
    }
}
</script>

</body>
